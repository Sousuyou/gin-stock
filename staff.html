<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- セキュリティ: 公開カタログ(index.html)と違い、connect-src に Supabase プロジェクトだけ追加。
         script-src は 'self' のまま（外部JSライブラリ不使用）。接続先は submit.js の SUPABASE_URL と必ず一致させること。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://ypruajtzzfvfhgcirrsv.supabase.co; object-src 'none'; base-uri 'self'"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
    <title>新規ジン申請（スタッフ用）｜Bar Soutsu</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="stylesheet" href="styles.css?v=20260629-botanical-lite1" />
    <link rel="stylesheet" href="https://sousuyou.github.io/top/theme.css" />

    <style>
      /* 申請フォーム専用の最小スタイル（CSPは style-src 'unsafe-inline' を許可済み） */
      .staff-note {
        margin: 14px 0 0; padding: 9px 12px;
        font-size: 0.78rem; line-height: 1.6;
        color: var(--green); border: 1px solid var(--green);
        background: var(--green-soft);
      }
      .pin-row { display: flex; gap: 8px; align-items: stretch; margin-top: 10px; }
      .pin-row input { max-width: 220px; }
      .pin-error { margin: 8px 0 0; font-size: 0.78rem; color: var(--red); min-height: 1.1em; }
      .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 4px; }
      .grid-2 { display: grid; grid-template-columns: 1fr 110px; gap: 12px; }
      .grid-c { display: grid; grid-template-columns: 150px 1fr; gap: 12px; }
      .check-row { display: flex; align-items: center; gap: 8px; }
      .check-row input { width: auto; min-height: 0; }
      .req { color: var(--red); }
      textarea {
        width: 100%; min-height: 70px; border: 1px solid var(--line-strong);
        border-radius: 0; padding: 8px 10px; background: var(--field); color: var(--text);
        font: inherit; resize: vertical;
      }
      .dup-warn { margin: 4px 0 0; font-size: 0.74rem; color: var(--gold); min-height: 1em; }
      .field-hint { margin: 4px 0 0; font-size: 0.72rem; color: var(--muted); line-height: 1.5; }
      .submit-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
      .submit-msg { font-size: 0.8rem; line-height: 1.5; }
      .submit-msg.is-ok { color: var(--green); }
      .submit-msg.is-error { color: var(--red); }
      .send-where { font-size: 0.66rem; color: var(--muted); }
      @media (max-width: 640px) {
        .grid-2, .grid-c { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="brand-mark">Bar Soutsu</p>
        <p class="eyebrow">Staff only · 新規ジン申請</p>
        <h1>在庫にないジンを申請</h1>
        <p class="lead">リストにないジンを見つけたら入力してください。送信内容は「申請箱」に入り、オーナーが事実確認のうえカタログに反映します。送信だけでは公開カタログは変わりません。</p>
      </header>

      <!-- スタッフパスワードゲート（解錠するまでフォームは出ない） -->
      <section class="card" id="pin-gate" aria-label="スタッフパスワード">
        <label class="field-label" for="pin-input">スタッフパスワード</label>
        <div class="pin-row">
          <input id="pin-input" type="password" inputmode="text" autocomplete="off" placeholder="パスワードを入力" />
          <button id="pin-submit" type="button">解錠</button>
        </div>
        <p class="pin-error" id="pin-error" aria-live="polite"></p>
      </section>

      <!-- 申請フォーム本体（解錠後に表示） -->
      <section class="card" id="form-wrap" hidden aria-label="新規ジン申請フォーム">
        <div class="form-grid">
          <div>
            <label class="field-label" for="f-name">銘柄名（英字の正式表記）</label>
            <input id="f-name" type="text" autocomplete="off" placeholder="例：FORDS GIN OFFICERS' RESERVE" />
            <p class="dup-warn" id="dup-warn" aria-live="polite"></p>
          </div>

          <div>
            <label class="field-label" for="f-kana">カナ読み</label>
            <input id="f-kana" type="text" autocomplete="off" placeholder="例：フォーズ ジン オフィサーズ リザーブ" />
            <p class="field-hint">※ 銘柄名・カナ読みは、分かる方だけでもOK（どちらか一方は入力してください）</p>
          </div>

          <div class="grid-c">
            <div>
              <label class="field-label" for="f-country-main">国（代表）<span class="req"> *</span></label>
              <input id="f-country-main" type="text" list="country-main-list" autocomplete="off" placeholder="例：イギリス" />
              <datalist id="country-main-list"></datalist>
            </div>
            <div>
              <label class="field-label" for="f-country">産地（詳細）</label>
              <input id="f-country" type="text" autocomplete="off" placeholder="例：イギリス（ロンドン）" />
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label class="field-label" for="f-botanicals">ボタニカル（読点区切り）</label>
              <input id="f-botanicals" type="text" autocomplete="off" placeholder="例：ジュニパー、コリアンダー、レモン" />
            </div>
            <div>
              <label class="field-label" for="f-abv">度数 ABV（%）</label>
              <input id="f-abv" type="text" inputmode="decimal" autocomplete="off" placeholder="例：54.5" />
            </div>
          </div>

          <div>
            <label class="field-label" for="f-note">解説メモ（任意・下書き可）</label>
            <textarea id="f-note" placeholder="味わい・由来など分かる範囲で。未確認情報の下書きでOK"></textarea>
          </div>

          <div class="check-row">
            <input id="f-not-gin" type="checkbox" />
            <label for="f-not-gin">このボトルはジンではない（当店にあるが分類が違う）</label>
          </div>
        </div>

        <p class="staff-note">送信すると「申請箱」に入ります。公開カタログへの反映には、オーナーの事実確認が必要です。</p>

        <div class="submit-foot">
          <span class="send-where">送信先：申請箱（pending・投稿専用）</span>
          <button id="do-submit" type="button">申請箱に送る</button>
        </div>
        <p class="submit-msg" id="submit-msg" aria-live="polite"></p>
      </section>

      <footer class="app-footer">
        <span>Bar Soutsu｜スタッフ専用ツール</span>
        <span>このページは公開カタログとは分離されています</span>
      </footer>
    </main>

    <script src="boot.js?v=20260629-cache-reset-v9" defer></script>
    <script src="submit.js?v=20260627-detail-back-v1" defer></script>
  </body>
</html>
