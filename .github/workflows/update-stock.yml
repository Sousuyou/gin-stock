name: 在庫データ自動更新

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: スプレッドシートから gins.json を作り直す
        run: python build_gins.py

      - name: 変更があればコミットして反映
        run: |
          if [[ -n "$(git status --porcelain gins.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gins.json
            git commit -m "在庫データを自動更新"
            git push
            echo "gins.json を更新しました"
          else
            echo "変更なし"
          fi
